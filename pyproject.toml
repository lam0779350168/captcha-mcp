[project]
name = "captcha-mcp"
version = "0.1.0"
description = "MCP server for solving reCAPTCHA / Turnstile / hCaptcha / image captcha via popular providers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Phu Lam"}]
keywords = ["mcp", "captcha", "recaptcha", "turnstile", "hcaptcha", "ai", "llm"]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]
stealth = ["nodriver>=0.39"]

[project.scripts]
captcha-mcp = "captcha_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/you/captcha-mcp"
Issues = "https://github.com/you/captcha-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_mcp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
